name: Check published generator
on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:registry
      - uses: actions/upload-artifact@v4
        with:
          name: generator-npm-${{ matrix.os }}
          path: artifacts/registry-validation.json
